name: Build Windows and macOS installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            name: windows-x64
          - runner: macos-15
            name: macos-arm64
          - runner: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest -v
      - run: python package_app.py --out releases
      - run: python package_app.py --native-installer --out releases
      - name: Verify the frozen program with synthetic artwork
        shell: bash
        run: |
          set -euo pipefail
          for artifact in releases/*; do
            python test_packaged_app.py "$artifact"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: releases/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish installers with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS.txt
          gh release create "$VERSION_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
